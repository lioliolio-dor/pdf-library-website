
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Enter Somewhere Else</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <main class="login-card">

    <a href="index.html" class="back-link">
      ← Back
    </a>

    <div class="login-icon">✦</div>

    <h1>Welcome back.</h1>

    <p class="subtitle">
      A little place for all your little things.
    </p>

    <div class="auth-tabs">

      <button id="loginTab"
              class="tab active"
              type="button">
        Login
      </button>

      <button id="signupTab"
              class="tab"
              type="button">
        Sign up
      </button>

    </div>

    <form id="authForm">

      <label for="email">Email address</label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        minlength="6"
        required
      >

      <button type="submit"
              id="authButton"
              class="primary-button">
        Login
      </button>

    </form>

    <p id="authMessage" class="message"></p>

    <p class="small-text">
      Your little corner of the internet.
    </p>

  </main>

  <script type="module" src="auth.js"></script>

</body>
</html>
